#!/usr/bin/env python
PACKAGE = "franka_weight_lift"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Defaults here are only a fallback: init() seeds this server's namespace from
# config/weight_lift_controller.yaml, so the yaml wins on startup.
gen.add("desired_force", double_t, 0,
        "downward force rendered at the end effector along -Z of the robot base [N]",
        0.0, 0.0, 50.0)
gen.add("k_p", double_t, 0, "force P gain [N/N]", 0.0, 0.0, 2.0)
gen.add("k_i", double_t, 0, "force I gain [N/(N*s)]", 0.0, 0.0, 5.0)
# Momentary trigger: acts on the false -> true edge, so untick it to re-arm.
# Only accepted with desired_force at 0 and the arm at rest, and nobody may
# touch the robot while it runs.
gen.add("recalibrate", bool_t, 0,
        "re-measure the external wrench bias at the pose the tool is in now", False)

exit(gen.generate(PACKAGE, "weight_lift", "weight_lift_param"))
